name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt 2>/dev/null || true

      - name: Run unit tests (rules)
        run: |
          python3 -m pytest tests/unit/rules/ -v --tb=short
