<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: true,
            theme: '{{THEME}}'
        });
    </script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #4ecdc4;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .diagram-container {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
            margin-bottom: 20px;
        }
        .info {
            margin-top: 20px;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 8px;
            border-left: 4px solid #4ecdc4;
        }
        .info h2 {
            color: #4ecdc4;
            margin-top: 0;
        }
        .actions {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #2d2d2d;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            background: #4ecdc4;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        .btn:hover {
            background: #45b7d1;
        }
        .btn-secondary {
            background: #6c5ce7;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #a29bfe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{TITLE}}</h1>
        <div class="subtitle">{{SUBTITLE}}</div>

        <div class="diagram-container">
            <pre class="mermaid">
{{MERMAID_CODE}}
            </pre>
        </div>

        {{EXTRA_CONTENT}}

        <div class="actions">
            <button class="btn" onclick="downloadSVG()">📥 Télécharger SVG</button>
            <button class="btn btn-secondary" onclick="downloadPNG()">📸 Télécharger PNG</button>
            <button class="btn" onclick="copyCode()">📋 Copier le code</button>
        </div>
    </div>

    <script>
        function downloadSVG() {
            const svg = document.querySelector('svg');
            if (!svg) return alert('❌ Diagramme non trouvé');

            // Cloner le SVG pour ne pas modifier l'original
            const svgClone = svg.cloneNode(true);

            // Ajouter les styles inline pour préserver l'apparence
            const svgStyles = window.getComputedStyle(svg);
            svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgClone);
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = '{{FILENAME}}.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Feedback visuel
            if (typeof event !== 'undefined' && event.target) {
                const btn = event.target;
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Téléchargé !';
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            }
        }

        function downloadPNG() {
            const svg = document.querySelector('svg');
            if (!svg) return alert('❌ Diagramme non trouvé');

            // Obtenir les dimensions du SVG
            const bbox = svg.getBoundingClientRect();
            const width = bbox.width;
            const height = bbox.height;

            // Créer un canvas avec les bonnes dimensions
            const canvas = document.createElement('canvas');
            const scale = 2; // Pour une meilleure qualité
            canvas.width = width * scale;
            canvas.height = height * scale;

            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

            // Cloner et préparer le SVG
            const svgClone = svg.cloneNode(true);
            svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            svgClone.setAttribute('width', width);
            svgClone.setAttribute('height', height);

            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgClone);

            // Créer un blob et une URL pour l'image
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            const img = new Image();

            img.onload = function() {
                // Dessiner sur le canvas avec fond (pour les SVG transparents)
                ctx.fillStyle = '#1e1e1e'; // Fond dark
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);

                // Convertir en PNG et télécharger
                canvas.toBlob(function(blob) {
                    const pngUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = pngUrl;
                    a.download = '{{FILENAME}}.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(pngUrl);
                    URL.revokeObjectURL(url);

                    // Feedback visuel
                    if (typeof event !== 'undefined' && event.target) {
                        const btn = event.target;
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '✅ Téléchargé !';
                        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
                    }
                }, 'image/png');
            };

            img.onerror = function() {
                alert('❌ Erreur lors de la conversion PNG. Essayez le SVG.');
                URL.revokeObjectURL(url);
            };

            img.src = url;
        }

        function copyCode() {
            const code = `{{MERMAID_CODE}}`;

            navigator.clipboard.writeText(code).then(() => {
                // Feedback visuel
                if (typeof event !== 'undefined' && event.target) {
                    const btn = event.target;
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '✅ Copié !';
                    setTimeout(() => { btn.innerHTML = originalText; }, 2000);
                }
            }).catch(() => {
                // Fallback pour les navigateurs qui ne supportent pas l'API clipboard
                const textarea = document.createElement('textarea');
                textarea.value = code;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();

                try {
                    document.execCommand('copy');
                    if (typeof event !== 'undefined' && event.target) {
                        const btn = event.target;
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '✅ Copié !';
                        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
                    }
                } catch (err) {
                    alert('❌ Erreur lors de la copie. Copiez manuellement depuis le diagramme.');
                }

                document.body.removeChild(textarea);
            });
        }
    </script>
</body>
</html>
